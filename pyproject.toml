[project]
name = "mrp"
version = "0.1.0"
description = "Galaxy finder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "swiftsimio>=12.1.4",
    "types-tqdm>=4.70.0.20260906",
]

[dependency-groups]
dev = [
    "icecream>=2.2.0",
    "pyrefly>=1.3.2",
    "ruff>=0.17.0",
    "tqdm>=4.70.1",
]

[tool.uv]
package = true

[tool.pyrefly]
errors.missing-attribute = false
